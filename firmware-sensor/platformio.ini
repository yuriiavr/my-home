; ── Мінімальна прошивка: тільки датчик температури й вологості DHT22 ──
; Прошити по USB (з цієї теки):  pio run -t upload
; Подивитись IP плати:            pio device monitor

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    beegee-tokyo/DHT sensor library for ESPx  ; датчик DHT22, хедер <DHTesp.h>
