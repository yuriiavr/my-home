; ── Конфігурація проєкту для PlatformIO (VS Code) ──
; Якщо колись захочеш Arduino IDE — дивись README, код повністю сумісний.

[env:esp32dev]
platform = espressif32
board = esp32dev          ; звичайна ESP32 DevKit. Для інших плат зміни сюди.
framework = arduino
monitor_speed = 115200

; Бібліотеки ставляться автоматично при першій збірці:
lib_deps =
    crankyoldgit/IRremoteESP8266   ; запис/відправка ІЧ (працює і на ESP32)
    bblanchon/ArduinoJson          ; збереження команд у JSON
    knolleary/PubSubClient         ; хмарний MQTT (керування з інтернету, TLS)

; Файлова система для збережених команд:
board_build.filesystem = littlefs

; Більший розділ під прошивку (режим полювання тягне всі AC-протоколи):
board_build.partitions = huge_app.csv

; ── Бездротова прошивка (OTA) ──
; Спадкує ВСЕ з esp32dev, лише змінює канал заливки з USB на WiFi.
; USB:     ... run -e esp32dev     -t upload   (і -t uploadfs)
; По WiFi:  ... run -e esp32dev_ota -t upload   (і -t uploadfs)
[env:esp32dev_ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = 192.168.0.108        ; IP плати в мережі (змінити за потреби)
; Пароль OTA НЕ зберігаємо в git: реальне значення живе у src/secrets.h
; (SECRET_OTA_PASS). Перед OTA-заливкою задай змінну оточення, напр. у
; PowerShell:  $env:SMARTHOME_OTA_PASS = "пароль з secrets.h"
; (якщо змінна не задана, PlatformIO підставить порожній рядок і
; espota відмовить в авторизації — це очікувано).
upload_flags =
    --auth=${sysenv.SMARTHOME_OTA_PASS}
    --host_port=13232     ; фіксований зворотний порт (дозволений у фаєрволі)