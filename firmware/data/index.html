<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Розумний дім</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#0a0c10">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Розумний дім">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="phone">

    <!-- ── Лоудер підключення (перекриває все до першого стану) ── -->
    <div class="loader" id="loader">
      <div class="loader-spin">
        <span class="hub-ring"></span>
        <span class="hub-ring d2"></span>
        <svg class="hub-rot" width="96" height="96" viewBox="0 0 96 96">
          <circle cx="48" cy="48" r="40" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="5"></circle>
          <circle cx="48" cy="48" r="40" fill="none" stroke="#5b8def" stroke-width="5" stroke-linecap="round" stroke-dasharray="70 251"></circle>
        </svg>
        <div class="hub-wifi">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01"></path><path d="M2 8.82a15 15 0 0 1 20 0"></path><path d="M5 12.859a10 10 0 0 1 14 0"></path><path d="M8.5 16.429a5 5 0 0 1 7 0"></path></svg>
        </div>
      </div>
      <div class="loader-text">
        <div class="loader-title">Підключення до мережі</div>
        <div class="loader-msg" id="loaderMsg">Пошук хаба…</div>
      </div>
    </div>

    <div class="scroll">

      <!-- ── Екран: Дім ── -->
      <main id="view-home" class="view">
        <div class="info-cards" id="infoCards"></div>
        <section id="acCard"></section>
        <div id="quickAccess"></div>
      </main>

      <!-- ── Екран: Автоматизації ── -->
      <main id="view-auto" class="view" style="display:none">
        <div id="autoRoot"></div>
      </main>
    </div>

    <!-- ── Нижня навігація ── -->
    <nav class="bottom-nav" id="bottomNav"></nav>
  </div>

  <!-- MQTT-бібліотека (потрібна лише хмарному режиму; локально помилка завантаження нешкідлива) -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <!-- Дані брокера (лише хмара): файла нема локально — 404 нешкідливий, режим буде HTTP -->
  <script src="./config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
